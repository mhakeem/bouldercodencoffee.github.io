# Welcome to Bridgetown!
#
# This config file is for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.
#
# A list of all available configuration options can be found here:
# https://www.bridgetownrb.com/docs/configuration/options
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `bin/bridgetown start`. If you change this file, please restart the server process.
#
# For reloadable site metadata like title, SEO description, social media
# handles, etc., take a look at `src/_data/site_metadata.yml`
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#

url: "" # the base hostname & protocol for your site, e.g. https://example.com

permalink: pretty
template_engine: erb

# NOTE: Set because this repo is currently deployed as a GitHub Pages *project* site
# under github.com/mhakeem (mhakeem.github.io/bouldercodencoffee.github.io/)
# rather than at a domain root.
# TODO: Remove this (and the matching `publicPath` in
# esbuild.config.js) once the repo is owned by an org/user actually named
# bouldercodencoffee, where GitHub Pages serves it at the true root.
base_path: "/bouldercodencoffee.github.io"

collections:
  events:
    output: true
    permalink: pretty
    future: true

# rss
feed:
  collections:
    - events

timezone: America/Denver
pagination:
  enabled: true
