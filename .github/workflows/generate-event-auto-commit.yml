name: Generate event (auto-commit)

# Fully-automatic alternative to generate-event-pr.yml — commits the
# generated event page (with its social_post frontmatter) straight to
# master, then calls gh-pages.yml and post-to-socials.yml directly as
# reusable jobs (rather than relying on push/workflow_run events) since a
# GITHUB_TOKEN-authored push here does not trigger other workflows' push
# listeners.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 18 * * 4" # TEMP: Thursdays for testing — revert to "0 18 * * 2" (Tuesdays) once confirmed working

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-event-auto-commit:
    runs-on: ubuntu-latest
    outputs:
      event_file: ${{ steps.generate.outputs.event_file }}
      event_date: ${{ steps.generate.outputs.event_date }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate next event page
        id: generate
        run: ruby script/generate_event.rb --mode=direct

      - name: Commit and push
        id: commit
        if: steps.generate.outputs.event_file != ''
        env:
          EVENT_DATE: ${{ steps.generate.outputs.event_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_events/*.md
          git diff --cached --quiet && exit 0
          git commit -m "Add upcoming event page ($EVENT_DATE)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: generate-event-auto-commit
    if: needs.generate-event-auto-commit.outputs.event_file != ''
    uses: ./.github/workflows/gh-pages.yml
    with:
      ref: ${{ needs.generate-event-auto-commit.outputs.commit_sha }}

  post:
    needs: [generate-event-auto-commit, deploy]
    uses: ./.github/workflows/post-to-socials.yml
    with:
      event_file: ${{ needs.generate-event-auto-commit.outputs.event_file }}
      ref: ${{ needs.generate-event-auto-commit.outputs.commit_sha }}
    secrets: inherit
