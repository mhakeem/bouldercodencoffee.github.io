---
# One entry per Wednesday. Matched by exact date, so every week needs an
# entry, even skip weeks.
#
# Normal week:
#   - date: "2026-08-19"
#     location: "The Rayback"
#
# Normal week with a highlight (freeform, shown in the post):
#   - date: "2026-12-23"
#     location: "The Rayback"
#     highlight: "Last meetup of 2026!"
#
# Skip week (holiday, venue closed, or a same-day cancellation added when it
# happens) — location is still required; generates a cancellation page and
# posts it through the normal pipeline, just like a real event:
#   - date: "2026-12-30"
#     location: "The Rayback"
#     skip: true
#     reason: "New Year's week"
events:
  - date: "2026-08-19"
    location: "The Rayback"
  - date: "2026-08-26"
    location: "The Rayback"
  - date: "2026-09-02"
    location: "The Rayback"
    highlight: "First meetup of September!"
  - date: "2026-09-09"
    location: "The Rayback"
    highlight: "Bring a friend week"
  - date: "2026-09-16"
    location: "The Rayback"
    skip: true
    reason: "Venue closed for a private event"
  - date: "2026-09-23"
    location: "The Rayback"
    skip: true
    reason: "Winter storm warning"
